<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Políticos do Amazonas</title>
<meta name="description" content="Perfis, trajetórias, patrimônio declarado e dados das gestões de prefeitos, vereadores, deputados federais e senadores do Amazonas, a partir de fontes oficiais.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23002D72'/%3E%3Ctext x='16' y='22' font-size='14' text-anchor='middle' fill='%23F5A623' font-family='sans-serif' font-weight='700'%3EAM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--azul:#002D72;--azul2:#0a3f8f;--ouro:#F5A623;--bg:#f5f7fb;--card:#fff;--txt:#1a2233;--sub:#5b6577;--linha:#e3e8f0;--ok:#1b7f3b;--mau:#b42318;--aviso:#9a6700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#152033;--txt:#e7ecf4;--sub:#9fb0c8;--linha:#26344d;--azul2:#7fb0ff}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#152033;--txt:#e7ecf4;--sub:#9fb0c8;--linha:#26344d;--azul2:#7fb0ff}
*{box-sizing:border-box}
body{margin:0;font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
a{color:var(--azul2)}
header{background:var(--azul);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topo{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.marca{font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;white-space:nowrap}
.marca span{color:var(--ouro)}
nav{display:flex;gap:14px;flex-wrap:wrap}
nav a{color:#dfe8ff;text-decoration:none;font-size:.95rem}
nav a:hover,nav a:focus-visible{color:var(--ouro)}
#q{flex:1;min-width:200px;padding:9px 12px;border-radius:8px;border:0;font:inherit}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:16px;margin-bottom:16px}
h1{font-size:1.6rem;margin:.2rem 0 .6rem;color:var(--txt)}
h2{font-size:1.15rem;margin:0 0 .7rem;color:var(--azul2)}
h3{font-size:1rem;margin:1rem 0 .4rem}
.sub{color:var(--sub);font-size:.92rem}
.grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pessoa{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px;border-radius:10px;border:1px solid var(--linha);background:var(--card)}
.pessoa:hover,.pessoa:focus-visible{border-color:var(--ouro)}
.pessoa img,.sem-foto{width:44px;height:58px;object-fit:cover;border-radius:6px;background:var(--linha);flex:none}
.pessoa b{display:block;font-weight:600;font-size:.95rem;line-height:1.2}
.selo{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:99px;background:var(--azul);color:#fff;margin:2px 3px 0 0}
.selo.ouro{background:var(--ouro);color:#1a1300}
.tab{width:100%;border-collapse:collapse;font-size:.9rem}
.tab th,.tab td{padding:6px 8px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
.tab th{font-weight:600;color:var(--sub);font-size:.82rem;text-transform:uppercase;letter-spacing:.02em}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rolar{overflow-x:auto}
.ficha{display:flex;gap:18px;flex-wrap:wrap}
.ficha img{width:150px;height:200px;object-fit:cover;border-radius:10px;background:var(--linha)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:.6rem 0}
.kpi{border:1px solid var(--linha);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--sub);font-size:.82rem}
.eleito{color:var(--ok);font-weight:600}
.alerta{border-left:4px solid var(--ouro);padding:8px 12px;background:rgba(245,166,35,.09);border-radius:6px;font-size:.9rem;margin:.6rem 0}
.graf{position:relative;height:260px}
select,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--linha);background:var(--card);color:var(--txt)}
button{cursor:pointer}
.lista-mun{columns:4 170px;font-size:.95rem}
.lista-mun a{display:block;padding:2px 0}
footer{max-width:1180px;margin:0 auto;padding:16px;color:var(--sub);font-size:.85rem}
.carregando{color:var(--sub);padding:24px}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
@media (max-width:600px){h1{font-size:1.3rem}.ficha img{width:110px;height:146px}nav{gap:10px}}
</style>
</head>
<body>
<header>
  <div class="topo">
    <a class="marca" href="#/">Políticos do <span>AM</span></a>
    <input id="q" type="search" placeholder="Buscar político ou município…" aria-label="Buscar político ou município" autocomplete="off">
    <nav aria-label="Seções">
      <a href="#/municipios">Municípios</a><a href="#/bancada">Bancada federal</a><a href="#/estudos">Estudos</a><a href="#/sobre">Fontes e método</a>
    </nav>
  </div>
</header>
<main id="app"><p class="carregando">Carregando…</p></main>
<footer>Dados públicos oficiais (TSE, Tesouro Nacional, IBGE, INEP, CGU, Câmara dos Deputados, Senado Federal). Cada número mostra a fonte; confira antes de citar.
  <span id="gerado"></span></footer>
<script>
"use strict";
window._VERSION_LOG = ["v1.0 2026-10-15 [Proton]: primeira versão — busca, fichas de pessoa e município, bancada, estudos"];
window._VICIOS_CONHECIDOS = ["Chart.js: destruir o gráfico antes de recriar (graficos[] + destroy())"];
window._TENTATIVAS_FALHAS = [];

const CARGO = {prefeito:"Prefeito(a)", "vice-prefeito":"Vice-prefeito(a)", vereador:"Vereador(a)", deputado_federal:"Deputado(a) federal", senador:"Senador(a)", suplente_senador:"Suplente de senador(a)",
  deputado_estadual:"Deputado(a) estadual", governador:"Governador(a)", "vice-governador":"Vice-governador(a)"};
const FLAG = {P:"Prefeito(a)", V:"Vice-prefeito(a)", E:"Vereador(a)", D:"Deputado(a) federal", S:"Senador(a)", c:"Candidato(a)"};
const ELEITO = new Set(["ELEITO","ELEITO POR QP","ELEITO POR MÉDIA","MÉDIA"]);
let IDX = null, MUN = {}, SHARD = {}, graficos = [];
const $app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const brl = v => v == null ? "—" : v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const nf = (v, d=0) => v == null ? "—" : Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const dataBR = s => s ? s.split("-").reverse().join("/") : "—";
const idade = s => { if(!s) return ""; const n = new Date(s), h = new Date(); let a = h.getFullYear()-n.getFullYear(); if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--; return a; };
const foto = (id, tem, cls="") => tem ? `<img class="${cls}" src="fotos/${id}.jpg" alt="" loading="lazy" width="44" height="58">` : `<div class="sem-foto ${cls}" aria-hidden="true"></div>`;
const munNome = c => MUN[c] || (c ? c : "");
const linkMun = c => c && MUN[c] ? `<a href="#/m/${c}">${esc(MUN[c])}</a>` : "—";

async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error(u+" "+r.status); return r.json(); }
async function pessoa(id){ const k = id.slice(0,2); if(!SHARD[k]) SHARD[k] = await getJSON(`data/p/${k}.json`); return SHARD[k][id]; }
function limparGraficos(){ graficos.forEach(g => g.destroy()); graficos = []; }
function grafico(el, cfg){ const g = new Chart(el, cfg); graficos.push(g); return g; }
const corTxt = () => getComputedStyle(document.documentElement).getPropertyValue("--sub").trim();

function cartaoPessoa(p){ // p = linha do índice
  const [id, nome, urna, flags, cod, tem] = p;
  const selos = [...flags].map(f => `<span class="selo${"DS".includes(f)?" ouro":""}">${FLAG[f]}</span>`).join("");
  return `<a class="pessoa" href="#/p/${id}">${foto(id, tem)}<span><b>${esc(urna || nome)}</b><span class="sub">${esc(urna ? nome : "")}${cod && MUN[cod] ? " · "+esc(MUN[cod]) : ""}</span><br>${selos}</span></a>`;
}

// ---------------------------------------------------------------- telas
function telaInicio(){
  const n = IDX.pessoas.length, com = IDX.pessoas.filter(p => p[3] !== "c").length;
  const banc = IDX.bancada.map(([id]) => IDX.pessoas.find(p => p[0] === id)).filter(Boolean);
  $app.innerHTML = `
  <section class="card"><h1>Quem governou e quem representa o Amazonas</h1>
  <p>Trajetória eleitoral, mandatos, patrimônio declarado e os números das gestões municipais dos <b>62 municípios</b> desde 2000, mais a bancada do AM na Câmara e no Senado. São <b>${nf(n)}</b> pessoas, das quais <b>${nf(com)}</b> exerceram mandato.</p>
  <p class="sub">Use a busca no topo ou escolha um caminho abaixo. Tudo vem de fonte oficial, com o arquivo de origem indicado em cada ficha.</p></section>
  <section class="card"><h2>Bancada federal do AM</h2><div class="grade">${banc.slice(0,8).map(cartaoPessoa).join("")}</div><p><a href="#/bancada">Ver todos os ${banc.length} →</a></p></section>
  <section class="card"><h2>Municípios</h2><div class="lista-mun">${IDX.municipios.map(([c,nm]) => `<a href="#/m/${c}">${esc(nm)}</a>`).join("")}</div></section>
  <section class="card"><h2>Estudos</h2><p>Reeleição de prefeitos, mulheres eleitas, partidos, despesa com pessoal acima da LRF, IDEB durante os mandatos e emendas por habitante. <a href="#/estudos">Abrir estudos →</a></p></section>`;
}

function telaBusca(q){
  const t = norm(q).trim();
  if (t.length < 2) return telaInicio();
  const muns = IDX.municipios.filter(([,nm]) => norm(nm).includes(t));
  const peso = f => f === "c" ? 9 : ("DS".includes(f[0]) ? 0 : f.includes("P") ? 1 : f.includes("V") ? 2 : 3);
  const ps = IDX.pessoas.filter(p => norm(p[1]).includes(t) || norm(p[2]).includes(t)).sort((a,b) => peso(a[3]) - peso(b[3]) || (b[6]||0) - (a[6]||0));
  $app.innerHTML = `<section class="card"><h1>Busca: “${esc(q)}”</h1>
   ${muns.length ? `<h2>Municípios</h2><p>${muns.map(([c,nm]) => `<a href="#/m/${c}">${esc(nm)}</a>`).join(" · ")}</p>` : ""}
   <h2>Pessoas (${nf(ps.length)}${ps.length > 120 ? ", mostrando 120" : ""})</h2>
   ${ps.length ? `<div class="grade">${ps.slice(0,120).map(cartaoPessoa).join("")}</div>` : `<p class="sub">Ninguém com esse nome. Tente parte do nome ou o nome de urna.</p>`}</section>`;
}

function telaMunicipios(){
  $app.innerHTML = `<section class="card"><h1>Os 62 municípios do Amazonas</h1><div class="lista-mun">${IDX.municipios.map(([c,nm]) => `<a href="#/m/${c}">${esc(nm)}</a>`).join("")}</div></section>`;
}

function telaBancada(){
  const por = {deputado_federal:[], senador:[]};
  IDX.bancada.forEach(([id, cargo]) => { const p = IDX.pessoas.find(x => x[0] === id); if (p) por[cargo].push(p); });
  const ord = l => l.sort((a,b) => (b[6]||0) - (a[6]||0));
  $app.innerHTML = `<section class="card"><h1>Bancada federal do Amazonas</h1><p class="sub">Quem representou o AM na Câmara (desde 1999) e no Senado. Detalhes de atuação (proposições, votações, presença, cota e emendas) estão nos dossiês de cada parlamentar.</p>
    <h2>Senado (${por.senador.length})</h2><div class="grade">${ord(por.senador).map(cartaoPessoa).join("")}</div>
    <h2 style="margin-top:1rem">Câmara dos Deputados (${por.deputado_federal.length})</h2><div class="grade">${ord(por.deputado_federal).map(cartaoPessoa).join("")}</div></section>`;
}

async function telaPessoa(id){
  const p = await pessoa(id);
  if (!p) { $app.innerHTML = `<section class="card"><h1>Pessoa não encontrada</h1></section>`; return; }
  const ix = IDX.pessoas.find(x => x[0] === id) || [];
  const mand = p.mand.map(m => `<tr><td>${CARGO[m[0]]||esc(m[0])}</td><td>${m[1] ? linkMun(m[1]) : "Amazonas"}</td><td>${dataBR(m[2])} a ${dataBR(m[3])}</td><td>${esc(m[4])}</td><td>${esc(m[5])}${m[6] ? `<br><span class="sub">${esc(m[6])}</span>` : ""}</td></tr>`).join("");
  const cand = p.cand.slice().reverse().map(c => `<tr><td class="n">${c[0]}${c[9]==="s"?"<br><span class='sub'>supl.</span>":""}</td><td>${CARGO[c[1]]||esc(c[1])}${c[8]>1?" (2º turno)":""}</td><td>${c[2]?linkMun(c[2]):"Amazonas"}</td><td>${esc(c[3])} ${esc(c[4])}</td><td class="${ELEITO.has(c[5])?"eleito":""}">${esc(c[5].toLowerCase())}</td><td class="n">${nf(c[6])}</td><td class="n">${c[7]!=null?nf(c[7],2)+"%":"—"}</td></tr>`).join("");
  const bens = p.bens.map(b => `<tr><td class="n">${b[0]}</td><td>${CARGO[b[1]]||b[1]}</td><td>${linkMun(b[2])}</td><td class="n">${brl(b[3])}${b[6] ? `<br><span class="sub">declarado: ${brl(b[5])}; ${b[6]} item(ns) com valor fora do padrão excluído(s)</span>` : ""}</td><td class="n">${b[4]}</td></tr>`).join("");
  const parl = p.parl ? `<section class="card"><h2>Atuação ${p.parl.casa === "camara" ? "na Câmara dos Deputados" : "no Senado Federal"}</h2>
     ${p.parl.dossie ? `<p><a href="${esc(p.parl.dossie)}" target="_blank" rel="noopener">Dossiê completo (proposições, votações, presença, cota, emendas) →</a></p>` : `<p class="sub">Dossiê detalhado em preparação.</p>`}
     ${p.parl.resumo.length ? tabelaLivre(p.parl.resumo) : ""}<p class="sub">Fonte: ${p.parl.casa === "camara" ? "API de Dados Abertos da Câmara" : "Dados Abertos do Senado"}, CGU. Repositório <a href="https://github.com/leonzordhue/${p.parl.repo}" target="_blank" rel="noopener">${p.parl.repo}</a>.</p></section>` : "";
  $app.innerHTML = `<section class="card ficha">${ix[5] ? `<img src="fotos/${id}.jpg" alt="Foto de ${esc(p.nome)}" width="150" height="200">` : ""}
    <div><h1>${esc(p.nome)}</h1>
    <p>${[...(ix[3]||"")].map(f => `<span class="selo${"DS".includes(f)?" ouro":""}">${FLAG[f]}</span>`).join("")}</p>
    <p>${p.nasc ? `Nascimento: ${dataBR(p.nasc)} (${idade(p.nasc)} anos)` : ""}${p.natural ? ` · Natural de ${esc(p.natural)}` : ""}${p.genero ? ` · ${esc(p.genero)}` : ""}</p>
    <p class="sub">Código na plataforma: ${esc(id)} (derivado do título de eleitor; o título não é publicado).</p></div></section>
    ${mand ? `<section class="card"><h2>Mandatos</h2><div class="rolar"><table class="tab"><thead><tr><th>Cargo</th><th>Onde</th><th>Período</th><th>Partido</th><th>Origem</th></tr></thead><tbody>${mand}</tbody></table></div>
      <p class="sub">Mandatos municipais: eleitos segundo o TSE. Afastamento, cassação pela Câmara ou posse de suplente nem sempre constam no TSE.</p></section>` : ""}
    ${parl}
    ${p.tcu ? `<section class="card"><h2>Inabilitação pelo TCU</h2><div class="rolar"><table class="tab"><thead><tr><th>Processo</th><th>Acórdão</th><th class="n">Julgado em</th><th class="n">Trânsito em julgado</th><th class="n">Inabilitado(a) até</th></tr></thead><tbody>${p.tcu.map(t => `<tr><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td class="n">${dataBR(t[2])}</td><td class="n">${dataBR(t[3])}</td><td class="n">${dataBR(t[4])}</td></tr>`).join("")}</tbody></table></div>
      <p class="sub">Proibição de exercer cargo em comissão ou função de confiança na administração federal (Lei 8.443/1992, art. 60). Não é inelegibilidade automática; quem decide é a Justiça Eleitoral. Ligação feita só pelo CPF idêntico ao do registro de candidatura no TSE. Fonte: lista pública de inabilitados do TCU.</p></section>` : ""}
    ${p.autoria ? `<section class="card"><h2>Proposições na Câmara Municipal (${nf(p.autoria.n)})</h2>
      <p>${p.autoria.tipos.map(([t,n]) => `<span class="selo">${esc(t)}: ${nf(n)}</span>`).join(" ")}</p>
      <div class="rolar"><table class="tab"><thead><tr><th class="n">Data</th><th>Matéria</th><th>Ementa</th></tr></thead><tbody>${p.autoria.lista.map(a => `<tr><td class="n">${dataBR(a[0])}</td><td><a href="${esc(a[4])}" target="_blank" rel="noopener">${esc(a[2])}</a>${a[5]?"":" <span class='sub'>(coautor)</span>"}</td><td>${esc(a[3])}</td></tr>`).join("")}</tbody></table></div>
      <p class="sub">Matérias em que é autor(a) ou coautor(a), segundo o SAPL da Câmara${p.autoria.n > p.autoria.lista.length ? ` (mostrando as ${p.autoria.lista.length} mais recentes)` : ""}. O que a Câmara não cadastrou no SAPL não aparece. Fonte: SAPL/Interlegis da Câmara Municipal.</p></section>` : ""}
    ${p.votos ? `<section class="card"><h2>Votos nominais registrados (${nf(p.votos.n)})</h2>
      <p>${p.votos.cont.map(([t,n]) => `<span class="selo">${esc(t)}: ${nf(n)}</span>`).join(" ")}</p>
      <div class="rolar"><table class="tab"><thead><tr><th class="n">Data</th><th>Matéria</th><th>Voto</th><th>Resultado</th></tr></thead><tbody>${p.votos.lista.map(v => `<tr><td class="n">${dataBR(v[0])}</td><td>${v[5] ? `<a href="${esc(v[5])}" target="_blank" rel="noopener">${esc(v[1])}</a>` : esc(v[1]||"—")}<br><span class="sub">${esc(v[2])}</span></td><td><b>${esc(v[3])}</b></td><td>${esc(v[4]||"")}${v[6]!==""&&v[6]!=null?` <span class="sub">(${esc(v[6])} sim × ${esc(v[7])} não)</span>`:""}</td></tr>`).join("")}</tbody></table></div>
      <p class="sub">Votos nominais registrados no painel/SAPL da Câmara${p.votos.n > p.votos.lista.length ? ` (mostrando os ${p.votos.lista.length} mais recentes)` : ""}. Votações simbólicas não registram o voto de cada vereador. Fonte: SAPL/Interlegis da Câmara Municipal.</p></section>` : ""}
    ${p.gest ? `<section class="card"><h2>Gestões como prefeito(a): receita e despesa</h2>${tabGestoes(p.gest, false)}</section>` : ""}
    ${p.tce ? `<section class="card"><h2>Contas julgadas irregulares pelo TCE-AM (${p.tce.length})</h2><div class="rolar"><table class="tab"><thead><tr><th class="n">Sessão</th><th>Órgão</th><th>Natureza</th><th>Processo</th><th class="n">Exercício</th><th>Decisão</th></tr></thead><tbody>${p.tce.map(t => `<tr><td class="n">${dataBR(t[0])}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td><td>${esc(t[3])}</td><td class="n">${esc(t[4])}</td><td>${esc(t[5])}${t[6]?`<br><span class="sub">${esc(t[6])}</span>`:""}${t[8] && t[8] !== "cpf + nome" ? `<br><span class="sub">ligação: ${esc(t[8])}</span>` : ""}</td></tr>`).join("")}</tbody></table></div>
      <p class="sub">Relações de gestores com contas julgadas irregulares publicadas pelo TCE-AM: as de 2022 em diante pelo portal do tribunal; as de 2006 a 2021, que saíram do portal, por cópias arquivadas no Internet Archive (web.archive.org). Conta irregular não é inelegibilidade automática: a LC 64/1990 (art. 1º, I, g) exige irregularidade insanável, ato doloso de improbidade e decisão irrecorrível, e quem decide é a Justiça Eleitoral. Ligação pelo CPF e nome do registro de candidatura no TSE; nas relações antigas sem CPF, pelo nome no mesmo município do órgão, ou só pelo nome quando ele é único entre os candidatos municipais (marcado "a conferir"). Fonte: portal de transparência do TCE-AM.</p></section>` : ""}
    ${p.tcedec ? (() => { const ruins = p.tcedec.filter(t => /irregular|desaprova|multa|alcance|ilegal/.test(t[5]));

function tabelaLivre(linhas){
  const cols = Object.keys(linhas[0]).filter(c => !["senador","deputado","codigo","id"].includes(c));
  return `<div class="rolar"><table class="tab"><thead><tr>${cols.map(c => `<th class="n">${esc(c.replace(/_/g," "))}</th>`).join("")}</tr></thead><tbody>${linhas.map(l => `<tr>${cols.map(c => `<td class="n">${esc(isNaN(+l[c]) || l[c]==="" ? l[c] : (c.match(/ceap|emenda|empenhado|pago|valor/) ? brl(+l[c]) : nf(+l[c])))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

      {label:"Receita orçamentária", data:fin.map(f => f.receita_orcamentaria), borderColor:"#F5A623", backgroundColor:"#F5A623", spanGaps:false}]},
      options:{maintainAspectRatio:false, scales:{y:{...eixo, ticks:{color:corTxt(), callback:v => brl(v)}}, x:eixo}, plugins:{legend:{labels:{color:corTxt()}}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${brl(c.raw)}`}}}}});
    grafico(document.getElementById("gSE"), {type:"line", data:{labels:anos, datasets:[
      {label:"Saúde", data:fin.map(f => f.pct_saude_desp), borderColor:"#1b7f3b", backgroundColor:"#1b7f3b"},
      {label:"Educação", data:fin.map(f => f.pct_educacao_desp), borderColor:"#002D72", backgroundColor:"#002D72"}]},
      options:{maintainAspectRatio:false, scales:{y:{...eixo, min:0}, x:eixo}, plugins:{legend:{labels:{color:corTxt()}}}}});
    const gp = document.getElementById("gPes");
    if (gp) { const fp = fin.filter(f => f.dtp_pct_rcl != null);
      grafico(gp, {type:"line", data:{labels:fp.map(f=>f.ano), datasets:[{label:"Pessoal / RCL (%)", data:fp.map(f => f.dtp_pct_rcl), borderColor:"#002D72", backgroundColor:"#002D72"},
        {label:"Limite LRF 54%", data:fp.map(() => 54), borderColor:"#b42318", borderDash:[6,4], pointRadius:0}]},
        options:{maintainAspectRatio:false, scales:{y:{...eixo, suggestedMin:30, suggestedMax:65}, x:eixo}, plugins:{legend:{labels:{color:corTxt()}}}}}); }
  }
  if (m.ideb.length) {
    const ai = m.ideb.filter(r => r[1]==="Municipal"), anosI = [...new Set(ai.map(r=>r[2]))].sort();
    const serie = (et, k) => anosI.map(a => (ai.find(r => r[0]===et && r[2]===a)||[])[k] ?? null);
    grafico(document.getElementById("gIdeb"), {type:"line", data:{labels:anosI, datasets:[
      {label:"Anos iniciais", data:serie("anos iniciais (1º ao 5º)",3), borderColor:"#002D72", backgroundColor:"#002D72", spanGaps:true},
      {label:"Meta anos iniciais", data:serie("anos iniciais (1º ao 5º)",4), borderColor:"#002D72", borderDash:[5,4], pointRadius:0, spanGaps:true},
      {label:"Anos finais", data:serie("anos finais (6º ao 9º)",3), borderColor:"#F5A623", backgroundColor:"#F5A623", spanGaps:true},
      {label:"Meta anos finais", data:serie("anos finais (6º ao 9º)",4), borderColor:"#F5A623", borderDash:[5,4], pointRadius:0, spanGaps:true}]},
      options:{maintainAspectRatio:false, scales:{y:{...eixo, min:0, max:10}, x:eixo}, plugins:{legend:{labels:{color:corTxt()}}}}});
  }
  if (m.emendas.length) {
    const as = Object.keys(emAno).sort();
    grafico(document.getElementById("gEm"), {type:"bar", data:{labels:as, datasets:[{label:"Pago", data:as.map(a => emAno[a]), backgroundColor:"#F5A623"}]},
      options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => brl(c.raw)}}}, scales:{y:{ticks:{color:corTxt(), callback:v => brl(v)}}, x:eixo}}});
  }
}

async function telaEstudos(){
  const E = await getJSON("data/estudos.json");
  const tab = (e, lim, fmt) => `<div class="rolar"><table class="tab"><thead><tr>${e.colunas.map(c => `<th class="n">${esc(c)}</th>`).join("")}</tr></thead><tbody>${(lim ? e.linhas.slice(0,lim) : e.linhas).map(l => `<tr>${l.map((v,i) => `<td class="n">${fmt ? fmt(v,i,l) : esc(v ?? "—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const ide = E.ideb_mandatos, cols = ["Município","Mandato","Prefeito(a)","Partido","IDEB antes","IDEB fim","Variação"];
  const linhaIdeb = l => `<tr><td><a href="#/m/${l[1]}">${esc(l[0])}</a></td><td>${esc(l[2])}</td><td><a href="#/p/${l[3]}">${esc(l[4])}</a></td><td>${esc(l[5])}</td><td class="n">${nf(l[7],1)} (${l[6]})</td><td class="n">${nf(l[9],1)} (${l[8]})</td><td class="n ${l[10]>=0?"eleito":""}">${l[10]>0?"+":""}${nf(l[10],1)}</td></tr>`;
  const emp = E.emendas_per_capita;
  $app.innerHTML = `<section class="card"><h1>Estudos</h1>${E.avisos.map(a => `<p class="alerta">${esc(a)}</p>`).join("")}</section>
   ${E.painel ? `<section class="card"><h2>${esc(E.painel.titulo)}</h2><p class="sub">Clique no título de uma coluna para ordenar. Fontes: ${esc(E.painel.fonte)}.</p><div class="rolar" id="painel"></div></section>` : ""}
   <section class="card"><h2>${esc(E.reeleicao.titulo)}</h2>${tab(E.reeleicao, 0, (v,i) => i===4 && v!=null ? nf(v,1)+"%" : esc(v ?? "—"))}<p class="sub">${esc(E.reeleicao.metodo)} Fonte: ${esc(E.reeleicao.fonte)}.</p></section>
   <section class="card"><h2>${esc(E.mulheres.titulo)}</h2>${tab(E.mulheres, 0, (v,i) => (i===3||i===6) && v!=null ? nf(v,1)+"%" : esc(v ?? "—"))}<p class="sub">${esc(E.mulheres.metodo)} Fonte: ${esc(E.mulheres.fonte)}.</p></section>
   <section class="card"><h2>${esc(E.partidos.titulo)}</h2><div class="rolar"><table class="tab"><thead><tr><th>Eleição</th><th>Partidos (prefeitos eleitos)</th></tr></thead><tbody>${Object.entries(E.partidos.por_ciclo).reverse().map(([c,l]) => `<tr><td>${c}</td><td>${l.map(([p,n]) => `${esc(p)} ${n}`).join(" · ")}</td></tr>`).join("")}</tbody></table></div></section>
   ${E.pessoal.linhas.length ? `<section class="card"><h2>${esc(E.pessoal.titulo)}</h2>${tab(E.pessoal)}<p class="sub">${esc(E.pessoal.metodo)}</p></section>` : ""}
   <section class="card"><h2>${esc(ide.titulo)}</h2><p class="sub">${esc(ide.metodo)}</p>
     <h3>Maiores avanços</h3><div class="rolar"><table class="tab"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${ide.linhas.slice(0,15).map(linhaIdeb).join("")}</tbody></table></div>
     <h3>Maiores quedas</h3><div class="rolar"><table class="tab"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${ide.linhas.slice(-15).reverse().map(linhaIdeb).join("")}</tbody></table></div></section>
   ${E.patrimonio ? `<section class="card"><h2>${esc(E.patrimonio.titulo)}</h2><p class="alerta">${esc(E.patrimonio.metodo)}</p><p class="sub">Maiores aumentos entre ${nf(E.patrimonio.n_total)} casos.</p><div class="rolar"><table class="tab"><thead><tr><th>Nome</th><th>Mandato</th><th>Município</th><th class="n">Declarado</th><th class="n">4 anos depois</th><th class="n">Variação</th></tr></thead><tbody>${E.patrimonio.linhas.map(l => `<tr><td><a href="#/p/${l[0]}">${esc(l[1])}</a></td><td>${CARGO[l[2]]||esc(l[2])} (eleito em ${l[4]})</td><td>${linkMun(l[3])}</td><td class="n">${brl(l[5])}</td><td class="n">${brl(l[7])} <span class="sub">${l[6]}</span></td><td class="n">${brl(l[8])}</td></tr>`).join("")}</tbody></table></div><p class="sub">Fonte: ${esc(E.patrimonio.fonte)}.</p></section>` : ""}
   <section class="card"><h2>${esc(emp.titulo)}</h2><div class="rolar"><table class="tab"><thead><tr><th>Município</th><th class="n">Total pago</th><th class="n">População 2022</th><th class="n">R$ por habitante</th></tr></thead><tbody>${emp.linhas.map(l => `<tr><td><a href="#/m/${l[1]}">${esc(l[0])}</a></td><td class="n">${brl(l[2])}</td><td class="n">${nf(l[3])}</td><td class="n">${brl(l[4])}</td></tr>`).join("")}</tbody></table></div><p class="sub">${esc(emp.metodo)} Fonte: ${esc(emp.fonte)}.</p></section>`;
  if (E.painel) desenhaPainel(E.painel, 0, 1);
}

function desenhaPainel(P, col, dir){
  // colunas mostradas: [índice do valor, índice do ano, rótulo, formato]
  const C = [[0,null,"Município","t"],[2,null,"População 2022","n"],[3,4,"PIB/hab.","r"],[5,6,"IDEB iniciais","d"],[7,8,"IDEB finais","d"],[9,10,"MDE %","p"],[11,12,"Pessoal/RCL %","p"],[13,null,"Emendas/hab. (2019+)","r"],[14,15,"Saúde %","p"],[16,null,"IDHM 2010","i"]];
  const fmt = (v, f) => v == null ? "—" : f === "r" ? brl(v) : f === "d" ? nf(v,1) : f === "i" ? nf(v,3) : f === "p" ? nf(v,1)+"%" : f === "n" ? nf(v) : esc(v);
  const linhas = P.linhas.slice().sort((a,b) => { const x = a[C[col][0]], y = b[C[col][0]]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  document.getElementById("painel").innerHTML = `<table class="tab"><thead><tr>${C.map((c,i) => `<th class="${i?"n":""}"><button type="button" data-c="${i}" style="border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer" aria-label="Ordenar por ${c[2]}">${c[2]}${i===col?(dir>0?" ▲":" ▼"):""}</button></th>`).join("")}</tr></thead><tbody>${linhas.map(l => `<tr>${C.map((c,i) => i===0 ? `<td><a href="#/m/${l[1]}">${esc(l[0])}</a></td>` : `<td class="n" title="${c[1]!=null && l[c[1]] ? "ano "+l[c[1]] : ""}">${fmt(l[c[0]], c[3])}${c[1]!=null && l[c[1]] ? ` <span class="sub">${l[c[1]]}</span>` : ""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  document.querySelectorAll("#painel button").forEach(b => b.addEventListener("click", () => { const c = +b.dataset.c; desenhaPainel(P, c, c === col ? -dir : (c ? -1 : 1)); }));
}

function tabGestoes(G, comNome){
  if (!G || !G.length) return "";
  const ref = G[0][17], mi = v => v == null ? "—" : "R$ " + nf(v/1e6, 1) + " mi";
  return `<div class="rolar"><table class="tab"><thead><tr><th>Gestão</th>${comNome?"<th>Prefeito(a)</th>":"<th>Município</th>"}<th class="n">Receita</th><th class="n">Despesa</th><th class="n">Saúde</th><th class="n">Educação</th><th class="n">Despesa/hab./ano</th><th class="n">Pessoal/RCL médio</th></tr></thead><tbody>${G.map(g => `<tr><td>${esc(g[4].split(" ")[0])}–${esc(g[4].split(" ").slice(-1)[0])}${g[6]?" <span class='sub'>(em curso)</span>":""}${g[5]?`<br><span class="sub">sem dado: ${esc(g[5])}</span>`:""}</td><td>${comNome ? (g[15]?`<a href="#/p/${g[15]}">${esc(g[16])}</a>`:esc(g[16])) : linkMun(g[1])}</td><td class="n">${mi(g[7])}</td><td class="n">${mi(g[8])}</td><td class="n">${mi(g[9])}</td><td class="n">${mi(g[10])}</td><td class="n">${g[13]!=null?brl(g[13]):"—"}</td><td class="n">${g[14]!=null?nf(g[14],1)+"%":"—"}</td></tr>`).join("")}</tbody></table></div>
  <p class="sub">Soma dos anos de cada gestão (o ano vai para quem governou a maior parte dele), em R$ de ${ref} corrigidos pelo IPCA. Despesa empenhada e receita orçamentária da prefeitura (FINBRA até 2012, SICONFI desde 2014; 2013 não existe na fonte e não é estimado). Interinos que o TSE não registra não recebem anos. Fonte: Tesouro Nacional; IPCA/IBGE.</p>`;
}

function telaSobre(){
  $app.innerHTML = `<section class="card"><h1>Fontes e método</h1>
  <p>A plataforma junta três levantamentos feitos só com dados públicos oficiais. Cada pessoa tem um código derivado do título de eleitor (sha1, 10 caracteres), o mesmo nos três. Assim, quem foi vereador, prefeito e depois deputado aparece numa ficha só. O título e o CPF não são publicados.</p>
  <h2>Repositórios (código, dados e relatórios de integridade)</h2>
  <ul><li><a href="https://github.com/leonzordhue/dossieprefeitosAM" target="_blank" rel="noopener">dossieprefeitosAM</a>: prefeitos, vices e vereadores (TSE 2000–2024), finanças (FINBRA e SICONFI), IBGE, IDEB, mínimos da educação (SIOPE) e da saúde (SIOPS), IDHM, emendas recebidas, julgamentos da Justiça Eleitoral, contas irregulares no TCE-AM e inabilitações do TCU.</li>
  <li><a href="https://github.com/leonzordhue/deputadosfederais" target="_blank" rel="noopener">deputadosfederais</a>: deputados federais do AM desde 1999 (Câmara, CGU).</li>
  <li><a href="https://github.com/leonzordhue/senadorAM" target="_blank" rel="noopener">senadorAM</a>: senadores do AM (Senado, CGU).</li>
  <li><a href="https://github.com/leonzordhue/politicosAM" target="_blank" rel="noopener">politicosAM</a>: esta plataforma e o relatório da junção (INTEGRIDADE.md).</li></ul>
  <h2>Regras</h2><ul>
  <li>Dado sem fonte não entra. O que não pôde ser confirmado aparece como lacuna ou alerta, nunca como estimativa.</li>
  <li>O TSE registra quem foi eleito. Quando há eleição suplementar, a plataforma encerra o mandato anterior na data dela e mostra o fundamento do julgamento, se o TSE o publicou (2016 em diante). Interinos (em geral o presidente da Câmara), afastamentos e cassações pela Câmara não constam no TSE e aparecem como lacuna.</li><li>TCE-AM: relações oficiais de contas irregulares desde 2022 (ligadas por CPF e nome) e, para prefeitos e vices, as decisões da base de jurisprudência desde 2016. Decisões anteriores a 2016 não estão na base pública.</li><li>Câmaras Municipais: projetos, normas, votos nominais e Mesa Diretora vêm do SAPL (Interlegis) das 12 Câmaras que o alimentam (Boa Vista do Ramos, Borba, Coari, Codajás, Envira, Iranduba, Manacapuru, Manaus, Manicoré, Novo Airão, Parintins, Tefé). As outras 50 não publicam esses dados em formato aberto. Gastos de todas as Câmaras vêm do SICONFI.</li><li>Interinos e sucessões fora do TSE: a plataforma mostra quem a prefeitura declarou como prefeito ao SIOPE (2008–2023) quando não confere com o eleito. É sinal a conferir, não prova.</li>
  <li>Patrimônio é o declarado ao TSE pelo candidato.</li>
  <li>Finanças: o que a prefeitura declarou ao Tesouro. Ano em branco = não declarou.</li></ul>
  ${IDX.ausentes.length ? `<p class="sub" style="overflow-wrap:anywhere">Em preparação: ${IDX.ausentes.map(esc).join(", ")}.</p>` : ""}</section>`;
}

// ---------------------------------------------------------------- rotas
async function rota(){
  limparGraficos();
  const h = decodeURIComponent(location.hash.slice(1)) || "/";
  const [, tipo, arg] = h.split("/");
  try {
    if (tipo === "p" && arg) await telaPessoa(arg);
    else if (tipo === "m" && arg) await telaMunicipio(arg);
    else if (tipo === "busca") telaBusca(arg || "");
    else if (tipo === "municipios") telaMunicipios();
    else if (tipo === "bancada") telaBancada();
    else if (tipo === "estudos") await telaEstudos();
    else if (tipo === "sobre") telaSobre();
    else telaInicio();
  } catch (e) { console.error(e); $app.innerHTML = `<section class="card"><h1>Não foi possível carregar</h1><p class="sub">${esc(e.message)}</p></section>`; }
  window.scrollTo(0, 0);
}
let tBusca;
document.getElementById("q").addEventListener("input", e => { clearTimeout(tBusca); tBusca = setTimeout(() => { location.hash = "#/busca/" + encodeURIComponent(e.target.value); }, 250); });
(async () => {
  IDX = await getJSON("data/indice.json");
  IDX.municipios.forEach(([c, n]) => MUN[c] = n);
  document.getElementById("gerado").textContent = " Dados montados em " + IDX.gerado.replace("T", " ") + ".";
  window.addEventListener("hashchange", rota);
  rota();
})();
</script>
